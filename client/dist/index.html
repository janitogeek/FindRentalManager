    <!-- INSTANT PRE-LOADING SCRIPT - Runs before React -->
    <script>
    (function() {
      const loadingStatus = document.getElementById('loading-status');
      
      // Update loading text
      function updateStatus(text) {
        if (loadingStatus) {
          loadingStatus.textContent = text;
        }
      }
      
      // Pre-load data immediately
      async function instantPreload() {
        try {
          updateStatus('Pre-loading countries & hosts...');
          console.log('🚀 INSTANT PRELOAD: Starting before React...');
          
          // Check if we already have recent data
          const CACHE_VERSION = 'v3.0';
          const CACHE_TIMESTAMP = 'bds_cache_timestamp';
          const CACHE_VERSION_KEY = 'bds_cache_version';
          
          const lastCached = localStorage.getItem(CACHE_TIMESTAMP);
          const cacheVersion = localStorage.getItem(CACHE_VERSION_KEY);
          const now = Date.now();
          const oneHour = 60 * 60 * 1000;
          
          // Check if cache is valid (less than 1 hour old and correct version)
          if (lastCached && cacheVersion === CACHE_VERSION && (now - parseInt(lastCached)) < oneHour) {
            updateStatus('Using cached data...');
            console.log('✅ INSTANT PRELOAD: Using valid cache');
            
            // Set a flag that data is ready
            localStorage.setItem('bds_preload_ready', 'true');
            updateStatus('Ready!');
            return;
          }
          
          updateStatus('Fetching fresh data...');
          console.log('🔄 INSTANT PRELOAD: Fetching fresh data...');
          
          // Fetch submissions data
          const response = await fetch('/api/airtable-submissions');
          if (!response.ok) {
            throw new Error(`Failed to fetch: ${response.status}`);
          }
          
          const submissions = await response.json();
          updateStatus('Processing ' + submissions.length + ' hosts...');
          console.log(`📊 INSTANT PRELOAD: Got ${submissions.length} submissions`);
          
          // Store raw data with timestamp and version
          localStorage.setItem('bds_submissions_cache', JSON.stringify(submissions));
          localStorage.setItem(CACHE_TIMESTAMP, now.toString());
          localStorage.setItem(CACHE_VERSION_KEY, CACHE_VERSION);
          localStorage.setItem('bds_preload_ready', 'true');
          
          updateStatus('Data cached successfully!');
          console.log('✅ INSTANT PRELOAD: Data cached and ready!');
          
        } catch (error) {
          console.error('❌ INSTANT PRELOAD: Failed:', error);
          updateStatus('Loading...');
          // Don't block the app if pre-loading fails
        }
      }
      
      // Start pre-loading immediately
      instantPreload();
    })();
    </script>
